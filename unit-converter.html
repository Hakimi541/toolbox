<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Free online unit converter for length, weight and temperature. Convert meters, kilometers, miles, feet, kilograms, pounds, Celsius, Fahrenheit and more quickly and easily.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://hakimi541.github.io/toolbox/unit-converter.html">

<title>Free Unit Converter – Length, Weight & Temperature | ToolBox</title>

<link rel="stylesheet" href="tool-style.css">
</head>

<body>

<nav class="nav">
<a class="logo" href="index.html"><span>◆</span>ToolBox</a>
<a class="back" href="index.html">← All tools</a>
</nav>

<section class="hero">
<div class="hero-badge">CONVERTER</div>

<h1>Unit <em>Converter</em></h1>

<p>Convert length, weight and temperature quickly.</p>
</section>

<main class="compressor">

<div class="panel">

<select id="type" onchange="updateUnits()">
<option value="length">Length</option>
<option value="weight">Weight</option>
<option value="temp">Temperature</option>
</select>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px">

<input
id="value"
type="number"
value="1"
oninput="convert()"
style="padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)"
>

<input
id="result"
readonly
style="padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)"
>

</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">

<select id="from" onchange="convert()"></select>

<select id="to" onchange="convert()"></select>

</div>

<p id="status" class="status"></p>

</div>

</main>

<footer>
<span>ToolBox</span>
<a href="index.html">Back to home</a>
</footer>

<script>

const units={
length:{
meter:1,
kilometer:1000,
centimeter:.01,
mile:1609.344,
foot:.3048,
inch:.0254
},

weight:{
kilogram:1,
gram:.001,
pound:.45359237,
ounce:.0283495
},

temp:{
celsius:1,
fahrenheit:1,
kelvin:1
}
};

const labels={
length:[
'meter',
'kilometer',
'centimeter',
'mile',
'foot',
'inch'
],

weight:[
'kilogram',
'gram',
'pound',
'ounce'
],

temp:[
'celsius',
'fahrenheit',
'kelvin'
]
};

function updateUnits(){

let a=labels[type.value];

from.innerHTML=to.innerHTML=
a.map(x=>`<option>${x}</option>`).join('');

to.selectedIndex=1;

convert();

}

function convert(){

let v=Number(value.value),
a=from.value,
b=to.value;

if(!Number.isFinite(v)){
result.value='';
return;
}

let r;

if(type.value==='temp'){

let c=
a==='celsius'
?v
:a==='fahrenheit'
?(v-32)*5/9
:v-273.15;

r=
b==='celsius'
?c
:b==='fahrenheit'
?c*9/5+32
:c+273.15;

}else{

r=v*units[type.value][a]/units[type.value][b];

}

result.value=Number(r.toFixed(8));

}

updateUnits();

</script>

</body>
</html>
