<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Free online case converter. Convert text to uppercase, lowercase, title case or sentence case instantly. Fast, simple and easy to use.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://hakimi541.github.io/toolbox/case-converter.html">

<title>Free Case Converter – Uppercase, Lowercase & Title Case | ToolBox</title>

<link rel="stylesheet" href="tool-style.css">
</head>

<body>

<nav class="nav">
<a class="logo" href="index.html"><span>◆</span>ToolBox</a>
<a class="back" href="index.html">← All tools</a>
</nav>

<section class="hero">
<div class="hero-badge">TEXT TOOL</div>

<h1>Case <em>Converter</em></h1>

<p>Change your text to uppercase, lowercase, title case or sentence case instantly.</p>
</section>

<main class="compressor">

<div class="panel">

<textarea
id="text"
placeholder="Type or paste your text here..."
style="width:100%;min-height:230px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;resize:vertical;outline:none"
></textarea>

<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px">

<button class="compress" onclick="convert('upper')">
UPPERCASE
</button>

<button class="compress" onclick="convert('lower')">
lowercase
</button>

<button class="compress" onclick="convert('title')">
Title Case
</button>

<button class="compress" onclick="convert('sentence')">
Sentence case
</button>

</div>

<button
class="compress"
style="margin-top:10px;background:#333"
onclick="copyText()"
>
Copy result
</button>

<p id="status" class="status"></p>

</div>

</main>

<footer>
<span>ToolBox</span>
<a href="index.html">Back to home</a>
</footer>

<script>

const t=document.getElementById('text'),
s=document.getElementById('status');

function convert(type){

let v=t.value;

if(type==='upper')
v=v.toUpperCase();

if(type==='lower')
v=v.toLowerCase();

if(type==='title')
v=v.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());

if(type==='sentence')
v=v.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());

t.value=v;
}

s.onclick=null;

async function copyText(){

try{

await navigator.clipboard.writeText(t.value);
s.textContent='Copied!';

}catch(e){

s.textContent='Select the text and copy it manually.';

}

}

</script>

</body>
</html>
