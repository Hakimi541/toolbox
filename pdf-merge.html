<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Merge multiple PDF files into one PDF online for free with ToolBox."><link rel="canonical" href="https://hakimi541.github.io/toolbox/pdf-merge.html"><link rel="icon" type="image/svg+xml" href="favicon.svg"><title>Merge PDF Files Online | ToolBox</title><link rel="stylesheet" href="tool-style.css"><style>.file-list{display:grid;gap:10px;margin-top:16px}.file-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.remove{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;padding:7px 10px;cursor:pointer}#fileInput{display:none}.add{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:12px;padding:14px;font-weight:700;cursor:pointer}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:13px;border-radius:11px;font-weight:700;cursor:pointer}.primary{border:0;background:var(--accent);color:#fff}.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}.status{text-align:center;min-height:18px;margin-top:12px;color:var(--muted);font-size:12px}.info{max-width:760px;margin:0 auto 18px;padding:0 20px;text-align:center;color:var(--muted);font-size:13px}</style></head><body><header class="site-header"><div class="nav container"><a class="brand" href="index.html"><span class="brand-mark">TB</span><span>ToolBox</span></a><nav><a href="index.html#tools">Tools</a><a href="pricing.html">Pricing</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></nav><button id="theme" class="icon-btn">☾</button></div></header><main class="tool-page"><section class="hero"><div class="container hero-inner"><div class="badge">📄 Free PDF Tool</div><h1>Merge <span>PDF Files</span></h1><p>Combine multiple PDF files into one document directly in your browser.</p></div></section><p class="info">Your PDF files stay in your browser and are not uploaded to ToolBox.</p><section class="panel"><input id="fileInput" type="file" accept="application/pdf,.pdf" multiple><label class="add" for="fileInput">＋ Choose PDF Files</label><div id="list" class="file-list"></div><div class="actions"><button id="clear" class="secondary">Clear</button><button id="merge" class="primary" disabled>Merge PDFs</button></div><div id="status" class="status"></div></section></main><footer><span>© 2026 ToolBox</span><span>Free • Fast • Easy to use</span></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>const input=document.getElementById('fileInput'),list=document.getElementById('list'),merge=document.getElementById('merge'),status=document.getElementById('status'),files=[];function render(){list.innerHTML='';files.forEach((f,i)=>{let r=document.createElement('div');r.className='file-item';r.innerHTML='<strong>'+(i+1)+'.</strong><span class="file-name">'+f.name+'</span><button class="remove">Remove</button>';r.querySelector('button').onclick=()=>{files.splice(i,1);render()};list.appendChild(r)});merge.disabled=files.length<2}input.onchange=()=>{[...input.files].forEach(f=>files.push(f));input.value='';render();status.textContent=files.length+' PDF files selected.'};document.getElementById('clear').onclick=()=>{files.length=0;render();status.textContent=''};merge.onclick=async()=>{merge.disabled=true;status.textContent='Merging PDFs…';try{let out=await PDFLib.PDFDocument.create();for(let i=0;i<files.length;i++){status.textContent='Processing PDF '+(i+1)+' of '+files.length+'…';let d=await PDFLib.PDFDocument.load(await files[i].arrayBuffer());(await out.copyPages(d,d.getPageIndices())).forEach(p=>out.addPage(p))}let blob=new Blob([await out.save()],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toolbox-merged.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='PDFs merged successfully.'}catch(e){status.textContent='Could not merge the PDFs. Please check the files.'}finally{merge.disabled=files.length<2}};const theme=document.getElementById('theme');theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');</script></body></html>
