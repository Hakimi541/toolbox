<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Split PDF files online for free with ToolBox. Extract selected pages directly in your browser."><link rel="canonical" href="https://hakimi541.github.io/toolbox/pdf-split.html"><link rel="icon" href="favicon.svg"><title>Split PDF Online | ToolBox</title><link rel="stylesheet" href="tool-style.css"><style>#f{display:none}.pick{display:block;text-align:center;background:var(--accent);color:#fff;padding:14px;border-radius:12px;font-weight:700;cursor:pointer}.name,.status{text-align:center;color:var(--muted);font-size:13px;margin:12px 0}.opts{margin-top:16px}.opts label{display:block;font-weight:700;margin-bottom:8px}.opts input{box-sizing:border-box;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:13px;border-radius:11px;font-weight:700;cursor:pointer}.primary{border:0;background:var(--accent);color:#fff}.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}.info{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 18px}@media(max-width:600px){.actions{flex-direction:column}}</style></head><body><header class="site-header"><div class="nav container"><a class="brand" href="index.html"><span class="brand-mark">TB</span><span>ToolBox</span></a><nav><a href="index.html#tools">Tools</a><a href="pricing.html">Pricing</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></nav><button id="theme" class="icon-btn">☾</button></div></header><main class="tool-page"><section class="hero"><div class="container hero-inner"><div class="badge">📄 Free PDF Tool</div><h1>Split <span>PDF</span></h1><p>Extract selected pages from a PDF into a new PDF.</p></div></section><p class="info">Your PDF stays in your browser and is not uploaded to ToolBox.</p><section class="panel"><input id="f" type="file" accept="application/pdf,.pdf"><label class="pick" for="f">＋ Choose PDF File</label><div id="name" class="name">No PDF selected</div><div class="opts"><label for="pages">Pages to extract</label><input id="pages" placeholder="Example: 1,3,5-7"></div><div class="actions"><button id="clear" class="secondary">Clear</button><button id="go" class="primary" disabled>Split PDF</button></div><div id="status" class="status"></div></section></main><footer><span>© 2026 ToolBox</span><span>Free • Fast • Easy to use</span></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>const f=document.getElementById("f"),go=document.getElementById("go"),name=document.getElementById("name"),pages=document.getElementById("pages"),status=document.getElementById("status");let file=null;f.onchange=()=>{file=f.files[0]||null;name.textContent=file?file.name:"No PDF selected";go.disabled=!file};document.getElementById("clear").onclick=()=>{file=null;f.value="";pages.value="";name.textContent="No PDF selected";go.disabled=true;status.textContent=""};function parse(s,total){let a=new Set;for(let x of s.split(",")){x=x.trim();if(/^\d+$/.test(x)){let n=+x;if(n>0&&n<=total)a.add(n-1)}else{let m=x.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let A=+m[1],B=+m[2];if(A>B)[A,B]=[B,A];for(let n=A;n<=B;n++)if(n>0&&n<=total)a.add(n-1)}}}return[...a].sort((a,b)=>a-b)}go.onclick=async()=>{go.disabled=true;status.textContent="Processing…";try{let doc=await PDFLib.PDFDocument.load(await file.arrayBuffer()),idx=parse(pages.value,doc.getPageCount());if(!idx.length)throw Error("Enter valid page numbers.");let out=await PDFLib.PDFDocument.create(),ps=await out.copyPages(doc,idx);ps.forEach(p=>out.addPage(p));let url=URL.createObjectURL(new Blob([await out.save()],{type:"application/pdf"})),a=document.createElement("a");a.href=url;a.download="toolbox-split.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent="PDF split successfully."}catch(e){status.textContent=e.message||"Could not split the PDF."}finally{go.disabled=!file}};const theme=document.getElementById("theme");theme.onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light")};if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark");</script></body></html>
