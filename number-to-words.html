<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Free number to words converter. Convert whole numbers from 0 to 999,999,999 into English words instantly. Fast, simple and easy to use.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://hakimi541.github.io/toolbox/number-to-words.html">

<title>Number to Words Converter – Convert Numbers to English Words | ToolBox</title>

<link rel="stylesheet" href="tool-style.css">
</head>

<body>

<nav class="nav">
<a class="logo" href="index.html"><span>◆</span>ToolBox</a>
<a class="back" href="index.html">← All tools</a>
</nav>

<section class="hero">
<div class="hero-badge">NUMBER TOOL</div>

<h1>Number to <em>Words</em></h1>

<p>Turn whole numbers into English words instantly.</p>
</section>

<main class="compressor">

<div class="panel">

<input
id="num"
type="number"
min="0"
max="999999999"
placeholder="Enter a number"
style="width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit"
>

<button
class="compress"
style="margin-top:12px"
onclick="run()"
>
Convert
</button>

<div
id="out"
style="margin-top:18px;padding:16px;background:var(--bg);border-radius:12px;line-height:1.7;min-height:60px"
></div>

</div>

</main>

<footer>
<span>ToolBox</span>
<a href="index.html">Back to home</a>
</footer>

<script>

const ones=[
'zero','one','two','three','four','five','six','seven','eight','nine',
'ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen',
'seventeen','eighteen','nineteen'
],

tens=[
'','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'
];

function chunk(n){

if(n<20)
return ones[n];

if(n<100)
return tens[Math.floor(n/10)]+(n%10?'-'+ones[n%10]:'');

if(n<1000)
return ones[Math.floor(n/100)]+' hundred'+(n%100?' '+chunk(n%100):'');

return '';

}

function words(n){

if(n<1000)
return chunk(n);

if(n<1e6)
return chunk(Math.floor(n/1000))+' thousand'+(n%1000?' '+chunk(n%1000):'');

if(n<1e9)
return chunk(Math.floor(n/1e6))+' million'+(n%1e6?' '+words(n%1e6):'');

}

function run(){

let n=Number(num.value);

out.textContent=
Number.isInteger(n)&&n>=0&&n<=999999999
?words(n)
:'Enter a whole number from 0 to 999,999,999.';

}

</script>

</body>
</html>
