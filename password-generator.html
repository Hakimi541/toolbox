<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Free password generator online. Create strong, random passwords with uppercase letters, lowercase letters, numbers and symbols. Generate passwords securely in your browser.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://hakimi541.github.io/toolbox/password-generator.html">

<title>Free Password Generator – Create Strong Random Passwords | ToolBox</title>

<link rel="stylesheet" href="tool-style.css">
<style>
.premium-banner{max-width:760px;margin:22px auto;padding:18px 20px;border:1px solid #c7d2fe;border-radius:14px;background:#eef2ff;color:#1e1b4b}
.premium-banner strong{display:block;font-size:18px;margin-bottom:6px}
.premium-banner p{margin:6px 0 12px}
.premium-btn{display:inline-block;padding:10px 15px;border-radius:9px;background:#4f46e5;color:white;text-decoration:none;font-weight:600}
@media(prefers-color-scheme:dark){.premium-banner{background:#1e1b4b;color:#eef2ff;border-color:#6366f1}}
</style>

<style>
.pg{max-width:700px;margin:32px auto;padding:0 20px}.card{padding:24px;border:1px solid #e5e7eb;border-radius:16px;background:var(--card,#fff)}
.output{display:flex;gap:8px;margin:18px 0}.output input{flex:1;padding:14px;border:1px solid #d9dee8;border-radius:10px;font-size:16px}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0}.row input[type=number]{width:75px;padding:10px;border:1px solid #d9dee8;border-radius:8px}
button{padding:12px 18px;border:0;border-radius:10px;cursor:pointer}.primary{width:100%;margin-top:8px}
small{opacity:.7}
</style>
</head>

<body>

<div class="pg">

<a href="index.html" class="back">← Back to ToolBox</a>

<h1>Password Generator</h1>

<p>Create a strong random password locally in your browser.</p>

<div class="premium-banner"><strong>🚀 ToolBox Premium (coming soon)</strong><p>Unlimited access will be available through a monthly plan after secure payment setup.</p><a class="premium-btn" href="pricing.html">View plans</a></div>

<div class="card">

<div class="output">
<input id="password" readonly placeholder="Your password">
<button id="copy">Copy</button>
</div>

<div class="row">

<label>
Length
<input id="length" type="number" min="6" max="64" value="16">
</label>

<label>
<input id="upper" type="checkbox" checked>
Uppercase
</label>

<label>
<input id="lower" type="checkbox" checked>
Lowercase
</label>

<label>
<input id="numbers" type="checkbox" checked>
Numbers
</label>

<label>
<input id="symbols" type="checkbox" checked>
Symbols
</label>

</div>

<button class="primary" id="generate">Generate Password</button>

<p>
<small>Password generation happens locally; nothing is sent to a server.</small>
</p>

</div>
</div>

<script>
const chars={
upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
lower:'abcdefghijklmnopqrstuvwxyz',
numbers:'0123456789',
symbols:'!@#$%^&*()-_=+[]{}'
};

function generate(){

let pool='',groups=[];

if(upper.checked){
pool+=chars.upper;
groups.push(chars.upper)
}

if(lower.checked){
pool+=chars.lower;
groups.push(chars.lower)
}

if(numbers.checked){
pool+=chars.numbers;
groups.push(chars.numbers)
}

if(symbols.checked){
pool+=chars.symbols;
groups.push(chars.symbols)
}

if(!pool){
password.value='Select at least one option.';
return
}

let len=Math.max(6,Math.min(64,+length.value||16)),out='';

groups.forEach(g=>{
if(out.length<len)
out+=g[Math.floor(Math.random()*g.length)]
});

while(out.length<len)
out+=pool[Math.floor(Math.random()*pool.length)];

password.value=out.split('').sort(()=>Math.random()-.5).join('');
}

generate.onclick=generate;

copy.onclick=async()=>{
if(password.value)
try{
await navigator.clipboard.writeText(password.value);
copy.textContent='Copied!';
setTimeout(()=>copy.textContent='Copy',1200)
}catch{}
};

generate();
</script>

</body>
</html>
